<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project Hub</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
      }

      main {
        width: min(720px, 92vw);
        background: #ffffff;
        border: 1px solid #dfe3eb;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      ul {
        padding-left: 1.25rem;
      }

      a {
        color: #0b63ce;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
        }

        main {
          background: #1f2937;
          border-color: #374151;
          box-shadow: none;
        }

        a {
          color: #93c5fd;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>My GitHub Pages Project Hub</h1>
      <p>
        This page is the single home for all of my future projects. Add each project as a
        list item below when it is ready.
      </p>
      <ul>
        <li><em>No projects added yet.</em></li>
      </ul>
    </main>
  </body>
</html>
